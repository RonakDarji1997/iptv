version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: iptv-sync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: iptv_sync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test123
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: iptv-sync-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass test123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iptv-sync-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: iptv_sync
      DB_USER: postgres
      DB_PASSWORD: test123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: test123
      JWT_SECRET: change-this-to-a-random-secret-in-production
      JWT_REFRESH_SECRET: change-this-to-another-random-secret-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      default:
        aliases:
          - iptv-api
      iptv_iptv-network:
        aliases:
          - iptv-api
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:3000/health\", res => { process.exit(res.statusCode===200 ? 0 : 1); }).on(\"error\", ()=>process.exit(1)); setTimeout(()=>process.exit(1),5000)'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: iptv-sync-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@iptvsync.com
      PGADMIN_DEFAULT_PASSWORD: test123
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  default:
    name: iptv-sync-network
  iptv_iptv-network:
    external: true
